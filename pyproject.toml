[project]
name = "tally"
version = "0.3.1"
description = "Count words, lines and characters in text files (pilot scenario S3)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tally = "tally.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
